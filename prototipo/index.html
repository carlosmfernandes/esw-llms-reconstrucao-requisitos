<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduLMS — Protótipo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login" class="login">
  <div class="login-card">
    <div class="logo">E</div>
    <h1>EduLMS</h1>
    <p>Sistema Web de Gestão da Aprendizagem</p>
    <form id="loginForm">
      <label>E-mail<input type="email" value="admin@edulms.local" required></label>
      <label>Senha<input type="password" value="123456" required></label>
      <label>Perfil
        <select id="role">
          <option value="admin">Administrador</option>
          <option value="teacher">Docente</option>
          <option value="student">Estudante</option>
        </select>
      </label>
      <button>Entrar no sistema</button>
    </form>
    <small>Protótipo visual para demonstração dos cenários de utilização.</small>
  </div>
</section>

<section id="system" class="hidden">
<header>
  <div class="brand"><div class="logo sm">E</div><div><b>EduLMS</b><small>Gestão da Aprendizagem</small></div></div>
  <div><span id="roleName" class="pill"></span> <button id="logout" class="outline">Sair</button></div>
</header>
<div class="layout">
  <aside><nav id="nav"></nav><footer>Protótipo acadêmico<br>HTML5 · CSS3 · JavaScript</footer></aside>
  <main id="main"></main>
</div>
</section>
<script src="app.js"></script>
</body>
</html>
